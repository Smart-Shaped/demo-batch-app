batch:
  spark:
    app:
      name: "batch-reviews"
    yarn:
      am:
        cores: 2
        memory: "2048m"
        memoryOverhead: "1024m"
    driver:
      memory: "1024m"
      cores: 2
      maxResultSize: "1024m"
    executor:
      memory: "5g"
      instances: 1
      cores: 2
      memoryOverhead: "1024m"
      heartbeatInterval: 60
    serializer: "org.apache.spark.serializer.KryoSerializer"
    memory:
      fraction: 0.75
      storageFraction: 0.5
    sql:
      parquet:
        compression:
          codec: "zstd"
      shuffle:
        partitions: 200
    cassandra:
      connection:
        host: "cassandra1"
        port: 9042
    hadoop:
      fs:
        defaultFS: "hdfs://namenode:8020"
      parquet:
        page:
          size:
            row:
              check:
                min: 2
                max: 10
      dfs:
        replication: 1
  kafka:
    server: "kafka1:19092"
    bootstrap-servers: kafka1:19092
    intervalMs: "30000"
    producer:
      bootstrap-servers: kafka1:19092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    topics:
      topic1:
        name: "topicReviews"
        class: "com.smartshaped.chameleon.reviews.batch.components.ReviewPreprocessor"
        path: "/user/spark/topicReviews/data.parquet"
        checkpoint: "/user/spark/checkpoint/topicReviews"
  updater:
    name: "TopReviewsUpdater"
    class: "com.smartshaped.chameleon.reviews.batch.components.TopReviewsUpdater"
  cassandra:
    node: "cassandra1"
    port: 9042
    datacenter: "datacenter1"
    checkpoint: "/user/spark/checkpoint/cassandra"
    keyspace: 
      name: "fesr_test"
    model:
      class: "com.smartshaped.chameleon.reviews.batch.utils.TopTenModel"
